name: "Security & Standards"

on:
  schedule:
    - cron: "0 0 * * 0"
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master", "develop", "development" ]

concurrency:
  group: security-standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpforge:
    uses: infocyph/phpforge/.github/workflows/security-standards.yml@main
    with:
      integration_services: '[]'
      service_topologies: '{}'
      php_extensions: "curl, fileinfo, openssl"
    permissions:
      security-events: write
      actions: read
      contents: read

  optional-capability-coldness:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup minimal PHP runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "curl, fileinfo, openssl, :grpc, :imap, :posix"
          coverage: none

      - name: Verify unloadable optional extensions are absent
        run: |
          php -r '
          foreach (["grpc", "imap", "posix"] as $extension) {
              if (extension_loaded($extension)) {
                  fwrite(STDERR, "Optional extension unexpectedly loaded: {$extension}\n");
                  exit(1);
              }
          }
          '

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run optional capability coldness gate
        env:
          TALKINGBYTES_OPTIONAL_COLDNESS: "1"
        run: vendor/bin/pest --configuration=vendor/infocyph/phpforge/resources/pest.xml --bootstrap=vendor/autoload.php tests/OptionalCapabilityColdnessTest.php


  runwire-absent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "curl, fileinfo, openssl"
          coverage: none

      - name: Install production dependencies without Runwire
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --classmap-authoritative

      - name: Verify standalone APIs stay cold without Runwire
        run: |
          php -r '
          require "vendor/autoload.php";

          if (class_exists(\Infocyph\Runwire\RuntimeContext::class)) {
              fwrite(STDERR, "Runwire unexpectedly available in production-only install\n");
              exit(1);
          }

          new \Infocyph\TalkingBytes\Http\HttpClientFactory();
          new \Infocyph\TalkingBytes\Email\EmailSenderFactory();
          new \Infocyph\TalkingBytes\Email\EmailMailboxFactory();
          new \Infocyph\TalkingBytes\Email\EmailReceiverFactory();
          new \Infocyph\TalkingBytes\Grpc\GrpcClientFactory();
          \Infocyph\TalkingBytes\Http\HttpClient::multi();
          '

  runwire-present:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "curl, fileinfo, openssl"
          coverage: none

      - name: Install development dependencies with Runwire
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Runwire integration and ownership gates
        run: |
          vendor/bin/pest \
            --configuration=vendor/infocyph/phpforge/resources/pest.xml \
            --bootstrap=vendor/autoload.php \
            --fail-on-skipped \
            tests/RunwireArchitectureTest.php \
            tests/RunwireIntegrationTest.php \
            tests/HttpConcurrentPoolTest.php \
            tests/SmtpTransportTest.php \
            tests/Pop3MailboxTest.php \
            tests/MailboxImapTest.php \
            tests/TransportProcessCoverageTest.php


  release-acceptance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "curl, fileinfo, openssl"
          coverage: none

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run detailed release test processing
        run: composer ic:tests:details

      - name: Run final project quality gate
        run: composer ic:tests

      - name: Run release guard
        run: composer ic:release:guard


  mailpit-integration:
    runs-on: ubuntu-latest
    services:
      mailpit:
        image: "axllent/mailpit@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d"
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: curl, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run Mailpit integration test
        env:
          RUN_MAILPIT_INTEGRATION: "1"
          SMTP_HOST: 127.0.0.1
          SMTP_PORT: 1025
          MAILPIT_API_BASE: http://127.0.0.1:8025
        run: vendor/bin/pest --configuration=vendor/infocyph/phpforge/resources/pest.xml --bootstrap=vendor/autoload.php --fail-on-skipped tests/MailpitIntegrationTest.php

  docs-warning-free:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install --disable-pip-version-check -r docs/requirements.txt

      - name: Build documentation with warnings as errors
        run: sphinx-build -W --keep-going -b html docs build/docs



  native-grpc-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP with native gRPC extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: "curl, fileinfo, openssl, grpc"
          coverage: none

      - name: Setup Python peer runtime
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install pinned native gRPC integration dependencies
        run: |
          composer require --dev \
            grpc/grpc:1.82.0 \
            google/protobuf:4.33.6 \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --with-all-dependencies
          python -m pip install --disable-pip-version-check grpcio==1.82.0

      - name: Verify native prerequisites
        run: |
          php -r '
          require "vendor/autoload.php";
          if (!extension_loaded("grpc")) {
              fwrite(STDERR, "ext-grpc is not loaded\n");
              exit(1);
          }
          fwrite(STDOUT, "ext-grpc " . phpversion("grpc") . "\n");
          if (!class_exists("Grpc\\BaseStub") || !class_exists("Google\\Protobuf\\GPBEmpty")) {
              fwrite(STDERR, "grpc/grpc or google/protobuf is unavailable\n");
              exit(1);
          }
          '

      - name: Run native gRPC interoperability tests
        env:
          RUN_GRPC_NATIVE_INTEGRATION: "1"
          GRPC_PYTHON_BINARY: python
        run: vendor/bin/pest --configuration=vendor/infocyph/phpforge/resources/pest.xml --bootstrap=vendor/autoload.php --fail-on-skipped tests/GrpcNativeIntegrationTest.php
